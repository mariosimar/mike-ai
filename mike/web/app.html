<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M.I.K.E. — Cognitive Neural Link</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg1:#070b18; --bg2:#0d1230; --bg3:#1a0b2e;
    --cyan:#22e3ff; --magenta:#c95bff; --green:#39ff9e; --amber:#ffc24b; --red:#ff4d7d;
    --glass:rgba(18,26,48,.55); --glass-bord:rgba(120,180,255,.18); --txt:#dfe7f5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,sans-serif;color:var(--txt);height:100vh;overflow:hidden;
    background:linear-gradient(125deg,var(--bg1),var(--bg2),var(--bg3),var(--bg1));
    background-size:400% 400%;animation:flow 22s ease infinite;
  }
  @keyframes flow{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
  /* particelle/griglia di sfondo */
  body::before{content:"";position:fixed;inset:0;background-image:
    radial-gradient(circle at 20% 30%,rgba(34,227,255,.08),transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(201,91,255,.10),transparent 40%);
    pointer-events:none}
  .glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--glass-bord);border-radius:18px;
    box-shadow:0 8px 40px rgba(0,0,0,.45), inset 0 0 30px rgba(40,80,160,.06)}
  /* HEADER */
  header{display:flex;align-items:center;gap:18px;padding:14px 22px;margin:12px 12px 0}
  .logo{font-size:30px;font-weight:800;letter-spacing:5px;
    background:linear-gradient(90deg,var(--cyan),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 26px rgba(34,227,255,.35);animation:pulse 3s ease infinite}
  @keyframes pulse{50%{filter:brightness(1.25)}}
  .sub{font-size:11px;letter-spacing:2px;color:#8fa6cf;margin-top:2px}
  .gauges{display:flex;gap:18px;margin-left:auto}
  .gauge{width:74px;text-align:center;font-size:10px;color:#9fb3d6;letter-spacing:1px}
  .ring{width:64px;height:64px;border-radius:50%;margin:0 auto 4px;display:grid;place-items:center;
    background:conic-gradient(var(--c,var(--cyan)) calc(var(--p,0)*1%), rgba(255,255,255,.06) 0);
    transition:background .6s ease}
  .ring i{width:50px;height:50px;border-radius:50%;background:#0a1024;display:grid;place-items:center;
    font-size:14px;font-weight:700;color:#fff;font-style:normal}
  .leds{display:flex;gap:10px;margin-left:18px;font-size:11px;align-items:center}
  .led{padding:4px 9px;border-radius:20px;border:1px solid var(--glass-bord);background:rgba(0,0,0,.25)}
  .on{color:var(--green);border-color:rgba(57,255,158,.4)} .off{color:var(--red);opacity:.7}
  /* LAYOUT */
  main{display:flex;gap:12px;padding:12px;height:calc(100vh - 132px)}
  .chat-col{flex:1;display:flex;flex-direction:column;min-width:0}
  .side-col{width:430px;display:flex;flex-direction:column}
  /* CHAT */
  #chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
  #chat::-webkit-scrollbar{width:8px}#chat::-webkit-scrollbar-thumb{background:rgba(120,180,255,.25);border-radius:8px}
  .msg{max-width:88%;padding:12px 16px;border-radius:16px;line-height:1.5;font-size:15px;
    white-space:pre-wrap;word-wrap:break-word;animation:rise .25s ease}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  .msg .who{font-size:11px;letter-spacing:1px;opacity:.7;margin-bottom:4px}
  .msg.user{align-self:flex-end;background:linear-gradient(135deg,rgba(57,255,158,.16),rgba(34,227,255,.10));
    border:1px solid rgba(57,255,158,.3)}
  .msg.mike{align-self:flex-start;background:linear-gradient(135deg,rgba(201,91,255,.14),rgba(34,227,255,.08));
    border:1px solid rgba(201,91,255,.3)}
  .msg.sys{align-self:center;font-size:13px;color:#9fb3d6;background:rgba(0,0,0,.2);border:1px dashed var(--glass-bord)}
  .input-row{display:flex;gap:10px;padding:12px;margin-top:12px}
  #txt{flex:1;background:rgba(5,9,20,.7);border:1px solid var(--glass-bord);border-radius:14px;
    color:#fff;padding:14px 16px;font-size:15px;outline:none;transition:.2s}
  #txt:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,227,255,.18)}
  button.act{border:none;border-radius:14px;padding:0 20px;font-weight:700;cursor:pointer;color:#04121f;
    background:linear-gradient(135deg,var(--cyan),var(--magenta));transition:.2s;letter-spacing:.5px}
  button.act:hover{filter:brightness(1.15);transform:translateY(-1px)}
  button.ghost{background:rgba(34,227,255,.12);color:var(--cyan);border:1px solid var(--glass-bord);
    border-radius:14px;padding:0 16px;cursor:pointer;font-weight:700;transition:.2s}
  button.ghost:hover{background:var(--cyan);color:#04121f}
  button.ghost.attivo{background:var(--green);color:#04121f}
  /* TABS */
  .tabs{display:flex;gap:6px;padding:10px}
  .tab{flex:1;text-align:center;padding:10px;border-radius:12px;cursor:pointer;font-weight:700;font-size:13px;
    color:#9fb3d6;background:rgba(0,0,0,.2);border:1px solid transparent;transition:.2s}
  .tab.sel{color:#04121f;background:linear-gradient(135deg,var(--cyan),var(--magenta))}
  .panel{flex:1;overflow:auto;padding:12px;display:none}
  .panel.sel{display:block}
  #map{width:100%;height:100%;min-height:340px;border-radius:14px}
  .map-search{display:flex;gap:8px;margin-bottom:10px}
  .map-search input{flex:1;background:rgba(5,9,20,.7);border:1px solid var(--glass-bord);border-radius:12px;color:#fff;padding:10px 12px;outline:none}
  .tool{display:block;width:100%;text-align:left;margin:6px 0;padding:12px 14px;border-radius:12px;cursor:pointer;
    background:rgba(8,16,36,.6);border:1px solid var(--glass-bord);color:var(--cyan);font-weight:600;transition:.2s}
  .tool:hover{background:var(--cyan);color:#04121f;transform:translateX(3px)}
  video,#shot{width:100%;border-radius:14px;background:#000;aspect-ratio:4/3;object-fit:cover}
  .cam-btns{display:flex;gap:8px;margin:10px 0}
  #opinione{margin-top:10px;padding:12px;border-radius:12px;background:rgba(201,91,255,.1);border:1px solid rgba(201,91,255,.3);min-height:40px;font-size:14px;line-height:1.5}
  footer{display:flex;justify-content:space-between;padding:6px 16px;font-size:11px;color:#7e92b8}
  .blink{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.2}}
</style>
</head>
<body>
<header class="glass">
  <div>
    <div class="logo">M.I.K.E.</div>
    <div class="sub">COGNITIVE NEURAL LINK · <span id="ver"></span></div>
  </div>
  <div class="leds">
    <span class="led" id="led-ollama">OLLAMA</span>
    <span class="led" id="led-claude">CLAUDE</span>
    <span class="led" id="led-gemini">GEMINI</span>
  </div>
  <div class="gauges">
    <div class="gauge"><div class="ring" id="g-ram" style="--c:var(--cyan)"><i id="v-ram">–</i></div>RAM</div>
    <div class="gauge"><div class="ring" id="g-disco" style="--c:var(--magenta)"><i id="v-disco">–</i></div>DISCO</div>
    <div class="gauge"><div class="ring" id="g-neural" style="--c:var(--green)"><i id="v-neural">0</i></div>NEURAL</div>
  </div>
</header>

<main>
  <section class="chat-col glass">
    <div id="chat"></div>
    <div class="input-row">
      <button class="ghost" id="btn-voce" title="Mike legge le risposte">🔊</button>
      <button class="ghost" id="btn-mic" title="Parla a Mike (una volta)">🎤</button>
      <button class="ghost" id="btn-continuo" title="Ascolto continuo a mani libere">🎙️</button>
      <input id="txt" placeholder="Chiedimi qualsiasi cosa…  (mappe, indirizzi, PC, internet)">
      <button class="act" id="btn-invia">INVIA ▸</button>
    </div>
  </section>

  <aside class="side-col glass">
    <div class="tabs">
      <div class="tab sel" data-t="map">🗺️ MAPPA</div>
      <div class="tab" data-t="cam">📷 CAMERA</div>
      <div class="tab" data-t="tools">🛠️ STRUMENTI</div>
    </div>
    <div class="panel sel" id="p-map">
      <div class="map-search">
        <input id="map-q" placeholder="Indirizzo o luogo (es. Colosseo, Roma)">
        <button class="act" id="map-go">CERCA</button>
      </div>
      <div id="map"></div>
    </div>
    <div class="panel" id="p-cam">
      <video id="cam" autoplay playsinline></video>
      <canvas id="shot" style="display:none"></canvas>
      <div class="cam-btns">
        <button class="ghost" id="cam-on">Accendi camera</button>
        <button class="act" id="cam-go">Come mi vedi? 🔍</button>
      </div>
      <div id="opinione">Accendi la camera e premi "Come mi vedi?": Mike (via Gemini) ti darà un'opinione.</div>
    </div>
    <div class="panel" id="p-tools"></div>
  </aside>
</main>

<footer>
  <span id="stato">📡 Inizializzazione…</span>
  <span>M.I.K.E. — assistente neurale locale</span>
</footer>

<script>
const $=s=>document.querySelector(s);
let voceOn=false, neural=0;

/* ---------- CHAT (streaming) ---------- */
function bolla(chi,cls){
  const d=document.createElement('div'); d.className='msg '+cls;
  d.innerHTML='<div class="who">'+chi+'</div><span class="t"></span>';
  $('#chat').appendChild(d); $('#chat').scrollTop=1e9; return d.querySelector('.t');
}
async function invia(testo){
  testo=(testo||$('#txt').value).trim(); if(!testo)return;
  $('#txt').value='';
  bolla('TU','user').textContent=testo;
  const out=bolla('MIKE','mike'); out.innerHTML='<span class="blink">▌</span>';
  neural=92; setStato('⚡ Elaborazione…');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({testo})});
    const reader=r.body.getReader(); const dec=new TextDecoder(); let full='';
    while(true){const {done,value}=await reader.read(); if(done)break;
      full+=dec.decode(value,{stream:true}); out.textContent=full; $('#chat').scrollTop=1e9;}
    if(voceOn&&full)parla(full);
  }catch(e){out.textContent='Errore di connessione: '+e;}
  neural=10; setStato('📡 Pronto');
}
$('#btn-invia').onclick=()=>invia();
$('#txt').addEventListener('keydown',e=>{if(e.key==='Enter')invia();});

/* ---------- VOCE (browser, italiano) ---------- */
function parla(t){try{const u=new SpeechSynthesisUtterance(t.slice(0,600));
  const v=speechSynthesis.getVoices().find(x=>x.lang.startsWith('it'));if(v)u.voice=v;u.lang='it-IT';
  speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
$('#btn-voce').onclick=()=>{voceOn=!voceOn;$('#btn-voce').classList.toggle('attivo',voceOn);};
let recog=null;
$('#btn-mic').onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Il riconoscimento vocale non è disponibile in questo browser (usa Chrome o Edge).');return;}
  if(!recog){recog=new SR();recog.lang='it-IT';recog.interimResults=false;
    recog.onresult=e=>{$('#txt').value=e.results[0][0].transcript;invia();};
    recog.onend=()=>$('#btn-mic').classList.remove('attivo');}
  $('#btn-mic').classList.add('attivo');recog.start();
};
/* ascolto continuo a mani libere */
let recogC=null, continuoOn=false;
$('#btn-continuo').onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Riconoscimento vocale non disponibile (usa Chrome o Edge).');return;}
  continuoOn=!continuoOn;
  $('#btn-continuo').classList.toggle('attivo',continuoOn);
  if(continuoOn){
    voceOn=true; $('#btn-voce').classList.add('attivo');   // mani libere: Mike risponde a voce
    if(!recogC){
      recogC=new SR(); recogC.lang='it-IT'; recogC.continuous=true; recogC.interimResults=false;
      recogC.onresult=e=>{const t=e.results[e.results.length-1][0].transcript.trim(); if(t) invia(t);};
      recogC.onend=()=>{ if(continuoOn){ try{recogC.start();}catch(e){} } }; // si riavvia da solo
    }
    try{recogC.start();}catch(e){}
    setStato('🎙️ Ascolto continuo attivo — parla pure');
  } else {
    try{recogC.stop();}catch(e){}
    setStato('📡 Pronto');
  }
};

/* ---------- TABS ---------- */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('sel'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('sel'));
  t.classList.add('sel'); $('#p-'+t.dataset.t).classList.add('sel');
  if(t.dataset.t==='map'&&window._map)setTimeout(()=>_map.invalidateSize(),120);
});

/* ---------- MAPPA (Leaflet + ricerca indirizzi) ---------- */
window._map=L.map('map',{zoomControl:true}).setView([41.9,12.5],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(_map);
let _marker=null;
async function cercaMappa(){
  const q=$('#map-q').value.trim(); if(!q)return;
  setStato('🗺️ Cerco "'+q+'"…');
  const r=await fetch('/api/geocode?q='+encodeURIComponent(q)); const j=await r.json();
  if(j.risultati&&j.risultati.length){const p=j.risultati[0];
    _map.flyTo([p.lat,p.lon],16); if(_marker)_marker.remove();
    _marker=L.marker([p.lat,p.lon]).addTo(_map).bindPopup(p.nome).openPopup();
    setStato('📍 '+p.nome.slice(0,60));
  }else{setStato('❌ Nessun risultato per "'+q+'"');}
}
$('#map-go').onclick=cercaMappa;
$('#map-q').addEventListener('keydown',e=>{if(e.key==='Enter')cercaMappa();});

/* ---------- CAMERA ---------- */
let stream=null;
$('#cam-on').onclick=async()=>{
  try{stream=await navigator.mediaDevices.getUserMedia({video:true});$('#cam').srcObject=stream;
    $('#opinione').textContent='Camera accesa. Premi "Come mi vedi?".';}
  catch(e){$('#opinione').textContent='Impossibile accedere alla camera: '+e;}
};
$('#cam-go').onclick=async()=>{
  if(!stream){$('#opinione').textContent='Prima accendi la camera.';return;}
  const v=$('#cam'),c=$('#shot');c.width=v.videoWidth||640;c.height=v.videoHeight||480;
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  const data=c.toDataURL('image/jpeg',0.85);
  $('#opinione').innerHTML='<span class="blink">Analizzo l\'immagine…</span>';
  try{const r=await fetch('/api/camera',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({immagine:data})});
    const j=await r.json();$('#opinione').textContent=j.opinione;if(voceOn)parla(j.opinione);}
  catch(e){$('#opinione').textContent='Errore: '+e;}
};

/* ---------- STRUMENTI ---------- */
const STRUMENTI=[
  ['🩺 Diagnosi PC','/diagnosi'],['🖥️ Cosa gira ora (processi)','/processi'],
  ['📑 Analizza crash & BSOD','/crash'],['💾 Spazio disco','/spazio'],
  ['👥 Account & accesso','/account'],['✨ Manutenzione completa','/manutenzione'],
  ['🧹 Pulisci temp','/pulisci'],['🌐 Flush DNS','/flush-dns'],
  ['🛡️ Antivirus veloce','/antivirus veloce'],['⚙️ Ripara file sistema','/ripara-file'],
  ['🌱 Auto-miglioramento','/migliora'],['🌐 Aggiorna conoscenze','/aggiorna'],
  ['📋 Report revisione','/revisione'],['🆘 Guida PC bloccato','/guida-bloccato'],
];
const pt=$('#p-tools');
STRUMENTI.forEach(([t,c])=>{const b=document.createElement('button');b.className='tool';b.textContent=t;
  b.onclick=()=>{document.querySelector('.tab[data-t="map"]');invia(c);};pt.appendChild(b);});

/* ---------- STATO + GAUGES (polling) ---------- */
function setStato(t){$('#stato').textContent=t;}
function ring(id,vid,p){$('#'+id).style.setProperty('--p',p);$('#'+vid).textContent=Math.round(p);}
function led(id,on){const e=$('#'+id);e.className='led '+(on?'on':'off');}
async function aggiornaStato(){
  try{const j=await (await fetch('/api/stato')).json();
    led('led-ollama',j.ollama);led('led-claude',j.claude);led('led-gemini',j.gemini);
    ring('g-ram','v-ram',j.ram||0);ring('g-disco','v-disco',j.disco||0);
    $('#ver').textContent='v'+(j.versione||'')+(j.modello?(' · '+j.modello):'');
  }catch(e){}
  neural+=(( (window._target!==undefined)?_target:neural)-neural)*.2;
  ring('g-neural','v-neural',neural);
}
setInterval(aggiornaStato,2500);aggiornaStato();
setInterval(()=>ring('g-neural','v-neural',neural),120);

/* benvenuto */
bolla('MIKE','mike').textContent='Sistema cognitivo online. Chiedimi qualsiasi cosa: '+
'mappe e indirizzi, lo stato del tuo PC, ricerche su internet. Posso parlarti (🔊) e ascoltarti (🎤).';
$('#txt').focus();
if('speechSynthesis' in window)speechSynthesis.getVoices();
</script>
</body>
</html>
